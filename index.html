<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>노인복지시설 건축 인허가 대시보드</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#1d2433;--sub:#667085;--line:#e3e7ef;--h:#2563c9;--c:#e0781c;--j:#1a9a6b}
*{box-sizing:border-box}body{margin:0;font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--ink)}
header{background:#fff;border-bottom:1px solid var(--line);padding:14px 24px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;position:sticky;top:0;z-index:20}
header h1{font-size:19px;margin:0;flex:1 1 320px}header h1 small{display:block;font-size:12px;color:var(--sub);font-weight:400;margin-top:3px}
.ctl{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--sub)}
select,input[type=search]{font:inherit;font-size:14px;padding:8px 10px;border:1px solid #cfd6e4;border-radius:8px;background:#fff;color:var(--ink)}
select#sido{font-weight:700;min-width:190px;border-color:#2b3a67}
main{max-width:1500px;margin:0 auto;padding:18px 24px 40px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;border-top:4px solid var(--k);cursor:pointer}
.kpi.on{box-shadow:0 0 0 2px var(--k) inset}
.kpi .t{font-size:13px;color:var(--sub)}.kpi .v{font-size:28px;font-weight:800;margin-top:4px}.kpi .v span{font-size:14px;font-weight:500;color:var(--sub);margin-left:4px}
.py{font-size:.62em;color:#667085;font-weight:500;line-height:1.3}.kpi .py{font-size:15px;margin-top:2px}td .py{font-size:11.5px}#noyu table{width:100%}#noyu th,#noyu td{text-align:right;padding:8px 10px}#noyu th:first-child,#noyu td:first-child{text-align:left}#noyu thead th{position:static;cursor:default}#noyu .gh{color:var(--h)}#noyu .gc{color:var(--c)}#noyu .gj{color:var(--j)}#noyu tr.old td{background:#fff7d6;font-weight:700}#noyu tr.sum td{font-weight:700}#noyu .n{color:#667085;font-size:12px;margin-top:8px;line-height:1.6}.dn{font-size:13px;margin-top:6px}.dn b{font-size:15px}.kpi .s{font-size:12px;color:var(--sub);margin-top:2px}
.grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px}
@media(max-width:1000px){.grid{grid-template-columns:1fr}.kpis{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.card h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tabs{display:inline-flex;border:1px solid #cfd6e4;border-radius:8px;overflow:hidden}.tabs button{border:0;background:#fff;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer;color:var(--sub)}
.tabs button.on{background:#2b3a67;color:#fff}
#mapwrap{position:relative}svg{width:100%;height:auto;max-height:780px;display:block;background:#f8fafd;border-radius:8px}
svg path{stroke:#fff;stroke-width:.5;vector-effect:non-scaling-stroke;cursor:pointer}svg path:hover{stroke:#111;stroke-width:1.6}
svg path.sel{stroke:#111;stroke-width:2}
svg text{pointer-events:none;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:.22em;stroke-linejoin:round}
.lg{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub);margin-top:8px}.lg i{display:block;width:180px;height:10px;border-radius:5px}
#tip{position:fixed;pointer-events:none;background:#1d2433;color:#fff;font-size:12.5px;padding:9px 12px;border-radius:8px;display:none;z-index:50;line-height:1.55;max-width:260px}
#tip b{font-size:13.5px}
.tblwrap{max-height:720px;overflow:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13.5px}th,td{padding:7px 10px;border-bottom:1px solid #eef1f6;text-align:right;white-space:nowrap}
th:nth-child(-n+2),td:nth-child(-n+2){text-align:left}
thead th{position:sticky;top:0;background:#f0f3f9;cursor:pointer;z-index:2;user-select:none}
tr.tot td{position:sticky;top:40px;background:#fff7d6;font-weight:800;z-index:1}
tbody tr:hover td{background:#f5f8ff}tr.sel td{background:#e6efff!important}
td.z{color:#b3bac8}
.tools{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}.tools input{flex:1;min-width:140px}
button.dl{border:1px solid #cfd6e4;background:#fff;border-radius:8px;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer}
.note{font-size:12px;color:var(--sub);line-height:1.7;margin-top:16px}.note b{color:var(--ink)}
.warn{background:#fff8e6;border:1px solid #f1dfa6;border-radius:8px;padding:8px 12px;font-size:12.5px;margin-top:10px;display:none}
/* 2026-11-10 사용자 요청: 전국 현황표를 맨 위로, 그 아래 허가·착공·준공(누르면 지도·표 전환) — 허가·착공·준공 글씨와 동수를 크게 */
#noyu h2{font-size:17px}
#noyu thead tr:first-child th{font-size:19px;font-weight:800;cursor:pointer;padding-top:10px;padding-bottom:10px}
#noyu thead tr:first-child th:first-child{font-size:14px;cursor:default}
#noyu thead th.gh{color:var(--h)!important}#noyu thead th.gc{color:var(--c)!important}#noyu thead th.gj{color:var(--j)!important}
#noyu thead tr:first-child th.on{text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:3px}
#noyu td.dn2{font-size:17px;font-weight:800}
#noyu tr.sum td.dn2{font-size:20px}
.kpi{padding:16px 20px}
.kpi:hover{box-shadow:0 0 0 2px var(--k) inset}
.kpi .kt{display:flex;align-items:center;gap:8px;font-size:26px;font-weight:800;color:var(--k);letter-spacing:-.3px;line-height:1.2}
.kpi .kt .on-b{font-size:12px;font-weight:700;color:#fff;background:var(--k);border-radius:999px;padding:2px 10px;display:none;letter-spacing:0}
.kpi.on .kt .on-b{display:inline-block}
.kpi .t{font-size:12.5px;margin-top:3px}
.kpi .kb{display:flex;gap:22px;align-items:flex-end;flex-wrap:wrap;margin-top:10px}
.kpi .kc{font-size:12.5px;color:var(--sub);font-weight:700}
.kpi .kd{font-size:36px;font-weight:800;line-height:1.1;margin-top:2px}
.kpi .kd span,.kpi .v span{font-size:17px;font-weight:700;color:var(--sub);margin-left:3px}
.kpi .v{font-size:26px;line-height:1.15;margin-top:2px}
.tabs button{font-size:15px;font-weight:700;padding:7px 16px}
/* 2026-11-13 사용자 요청: 현황표 아래 허가·착공·준공을 한 줄(3칸)로 — 좁은 화면에서도 세로로 쌓지 않고 카드 높이를 줄여 페이지 길이 단축 */
.kpis{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:10px;margin-bottom:14px}
.kpi{padding:10px 14px}
.kpi .kt{font-size:21px;gap:6px}
.kpi .kt small{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--sub);letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .kb{gap:16px;margin-top:6px;flex-wrap:nowrap}
.kpi .kc{font-size:11.5px}
.kpi .kd{font-size:30px}
.kpi .v{font-size:21px}
.kpi .kd span,.kpi .v span{font-size:13px}
.kpi .py{font-size:12px;margin-top:0}
@media(max-width:760px){.kpi{padding:8px 10px}.kpi .kt{font-size:16px}.kpi .kt small,.kpi .on-b{display:none!important}.kpi .kb{flex-direction:column;gap:4px;align-items:flex-start}.kpi .kd{font-size:22px}.kpi .v{font-size:15px}}
/* 2026-11-13 사용자 요청: 현황표의 건축허가·착공·준공을 칸(상자)으로 나눠 보기 편하게 — 상자를 누르면 아래 지도·표가 그 기준으로 바뀜 */
#noyu .nzg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
#noyu .nzb{border:1px solid var(--line);border-top:5px solid var(--k);border-radius:12px;background:var(--card);overflow:hidden;cursor:pointer;transition:box-shadow .15s}
#noyu .nzb:hover,#noyu .nzb.on{box-shadow:0 0 0 2px var(--k) inset}
#noyu .nzh{display:flex;align-items:center;gap:8px;padding:10px 14px 9px;font-size:21px;font-weight:800;color:var(--k);letter-spacing:-.3px;background:color-mix(in srgb,var(--k) 9%,transparent)}
#noyu .nzh .on-b{font-size:11.5px;font-weight:700;color:#fff;background:var(--k);border-radius:999px;padding:2px 9px;letter-spacing:0;display:none}
#noyu .nzb.on .nzh .on-b{display:inline-block}
#noyu .nzh small{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--sub);letter-spacing:0;white-space:nowrap}
#noyu .nzb.on .nzh small{display:none}
#noyu .nzb table{width:100%;font-size:13.5px}
#noyu .nzb tr.hd th{font-size:11.5px;font-weight:700;color:var(--sub);padding:7px 12px;background:transparent;border-bottom:1px solid var(--line)}
#noyu .nzb td{padding:7px 12px;vertical-align:middle}
#noyu .nzb td:first-child{white-space:normal;line-height:1.35}
#noyu .nzb tr.sum td{font-size:14.5px;background:color-mix(in srgb,var(--k) 5%,transparent)}
#noyu .nzb tr.sum td.dn2{font-size:24px;color:var(--k)}
#noyu .nzb tr:last-child td{border-bottom:0}
@media(max-width:700px){#noyu .nzg{grid-template-columns:1fr}}@media(max-width:1000px){#noyu .nzb td{padding:6px 8px}#noyu .nzh{font-size:18px;padding:8px 10px}#noyu .nzh small{display:none}#noyu .nzb tr.sum td.dn2{font-size:20px}}   /* 2026-11-13: 1000px 이하(런처 안 화면)에서도 3칸 한 줄 — 페이지 길이 단축 */
</style></head><body>

  h+='<div class="n">※ 세움터 현황표는 <b>노유자시설 전체</b>(노인복지시설, 아동관련시설, 사회복지시설, 근로복지시설 등) 단위까지만 신축·증축·용도변경별 동수를 제공하며, <b>노인복지시설만의 동수는 공개 집계에 없습니다.</b> 노란 행의 노인복지시설 면적은 엑셀(시군구별 용도별 현황) 값이며 지도·표의 시군구 숫자도 같은 값입니다. 시군구별 동수는 제공되지 않습니다.</div>';
  el.innerHTML=h;
  Array.prototype.forEach.call(el.querySelectorAll('.nzb[data-j]'),function(bx){bx.onclick=function(){st.metric=+bx.dataset.j;renderAll()}});
}
function renderAll(){renderKpis();renderNoyu();renderMap();renderTable();renderNote();
  Array.prototype.forEach.call(document.querySelectorAll('#tabs button'),function(b,j){b.className=j===st.metric?'on':''})}
function initControls(){
  $('month').innerHTML=months().map(function(m){return '<option value="'+m+'">'+DATA.months[m].label+'</option>'}).join('');
  if(!st.month||!DATA.months[st.month])st.month=months()[0];$('month').value=st.month;
  var cur=st.sido;$('sido').innerHTML='<option value="전국">전국</option>'+sidoList().map(function(s){return '<option>'+s+'</option>'}).join('');
  $('sido').value=cur;if($('sido').value!==cur){st.sido='전국'}
  $('tabs').innerHTML=M.map(function(m){return '<button>'+m.n+'</button>'}).join('');
  Array.prototype.forEach.call(document.querySelectorAll('#tabs button'),function(b,j){b.onclick=function(){st.metric=j;renderAll()}});
}
$('month').onchange=function(){st.month=this.value;initControls();renderAll()};
$('sido').onchange=function(){st.sido=this.value;st.sel=null;renderAll()};
$('q').oninput=function(){st.q=this.value;renderTable()};
$('dl').onclick=function(){var rs=curRows(),s='시도,시군구,허가(㎡),허가(평),착공(㎡),착공(평),준공(㎡),준공(평)\n'+rs.map(function(r){return [r[0],label(r),r[2],fmtP(r[2]).replace(/,/g,''),r[3],fmtP(r[3]).replace(/,/g,''),r[4],fmtP(r[4]).replace(/,/g,'')].join(',')}).join('\n');
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+s],{type:'text/csv'}));a.download='노인복지시설_'+st.month+'_'+st.sido+'.csv';a.click()};
initControls();renderAll();
// ── 자동 업데이트: 열 때마다 온라인의 최신 data.json 을 확인하고(브라우저에 보관), 오프라인이면 내장/보관 데이터로 표시 ──
var REMOTE='data.json';
var LS_KEY='ewd_data_v1';
function setStatus(t,c){var e=$('status');if(e){e.textContent=t;e.style.color=c||'#667085'}}
function applyData(d,keepMonth){var m=keepMonth?st.month:null;DATA=d;st.month=(m&&d.months[m])?m:null;initControls();renderAll()}
(function(){
  try{var c=JSON.parse(localStorage.getItem(LS_KEY)||'null');if(c&&c.months&&(c.generated||'')>(DATA.generated||'')){applyData(c,false)}}catch(e){}
  setStatus('최신 데이터 확인 중…');
  if(!REMOTE||REMOTE.indexOf('__')===0){setStatus('내장 데이터 · 기준 '+(DATA.generated||''));return}
  fetch(REMOTE+'?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(j){
    if(j&&j.months&&(j.generated||'')>(DATA.generated||'')){applyData(j,true);try{localStorage.setItem(LS_KEY,JSON.stringify(j))}catch(e){}setStatus('최신 데이터로 갱신됨 · 기준 '+j.generated,'#1a9a6b')}
    else setStatus('최신 데이터 확인됨 · 기준 '+(DATA.generated||''),'#1a9a6b');
  }).catch(function(){setStatus('오프라인 · 보관/내장 데이터 사용 중 (기준 '+(DATA.generated||'')+')','#c0561b')});
})();
</script></body></html>
